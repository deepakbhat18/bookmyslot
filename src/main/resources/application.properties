spring.application.name=bookmyslot

# Server port
server.port=${PORT:8080}

# ========= MYSQL CONFIG =========
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ========== EMAIL CONFIG (Google Apps Script) ==========
# GMAIL_SCRIPT_URL   – Deployed Apps Script URL (https://script.google.com/macros/s/.../exec)
# BOOKMYSLOT_SECRET  – Shared secret validated by the Apps Script
gmail.script.url=${GMAIL_SCRIPT_URL:}
bookmyslot.secret=${BOOKMYSLOT_SECRET:}

# ========= RAZORPAY CONFIG =========
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# ========= SESSION & COOKIE CONFIG (Cross-Site Vercel -> Render) =========
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:none}

# Support Render / Reverse Proxy HTTPS termination headers (X-Forwarded-Proto, etc.)
server.forward-headers-strategy=framework

# ========= CORS CONFIGURATION =========
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://bookmyslot-frontend-drab.vercel.app,http://localhost:5173,http://localhost:3000}