spring.application.name=bookmyslot

# Server port
server.port=${PORT:8080}

# ========= MYSQL CONFIG =========
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ========== EMAIL CONFIG (Google Apps Script) ==========
# GMAIL_SCRIPT_URL   – Deployed Apps Script URL (https://script.google.com/macros/s/.../exec)
# BOOKMYSLOT_SECRET  – Shared secret validated by the Apps Script
gmail.script.url=${GMAIL_SCRIPT_URL:}
bookmyslot.secret=${BOOKMYSLOT_SECRET:}

# ========= RAZORPAY CONFIG =========
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}